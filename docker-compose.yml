services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: playground
      POSTGRES_DB: playground
    volumes:
      - playground_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playground -d playground"]
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "3847:3847"
    environment:
      PORT: 3847
      DATABASE_URL: postgres://playground:playground@db:5432/playground
    depends_on:
      db:
        condition: service_healthy

volumes:
  playground_pgdata:
